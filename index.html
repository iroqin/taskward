<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Checklist Keluarga</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .slide-in { animation: slideIn 0.3s ease-out forwards; }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes slideIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        /* Custom Scrollbar for clean look */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .hidden-sidebar { transform: translateX(-100%); width: 0 !important; padding: 0 !important; overflow: hidden; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 overflow-hidden flex h-screen w-screen">

    <!-- LOGIN VIEW -->
    <div id="login-view" class="absolute inset-0 z-50 bg-slate-50 flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden">
            <div class="bg-indigo-600 p-6 text-center text-white">
                <h1 class="text-2xl font-bold">Checklist Keluarga</h1>
                <p class="opacity-80 text-sm mt-1">Pilih profil Anda untuk mulai</p>
            </div>
            
            <div id="login-users-container" class="p-6 grid grid-cols-2 gap-4">
                <!-- User buttons generated by JS -->
            </div>

            <div id="login-password-container" class="p-6 hidden text-center">
                <button onclick="window.backToUsers()" class="text-slate-400 hover:text-slate-600 mb-4 text-sm font-medium flex items-center justify-center w-full">
                    &larr; Kembali
                </button>
                <div class="w-20 h-20 mx-auto rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600 mb-4">
                    <i class="ph ph-lock-key text-4xl"></i>
                </div>
                <h2 id="login-greeting" class="text-xl font-bold mb-6">Masuk sebagai ...</h2>
                
                <form id="login-form" class="max-w-xs mx-auto">
                    <input type="password" id="pin-input" placeholder="Masukkan Password" class="w-full text-center text-xl p-3 border-b-2 border-slate-300 focus:border-indigo-600 outline-none bg-transparent mb-2" autofocus />
                    <p id="login-error" class="text-red-500 text-sm mb-4 hidden">Password salah!</p>
                    <button type="submit" class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-xl hover:bg-indigo-700 mt-4 transition-colors">Masuk</button>
                </form>
            </div>
        </div>
    </div>

    <!-- APP VIEW (Hidden by default) -->
    <div id="app-view" class="hidden flex-1 flex h-full w-full relative">
        
        <!-- Sidebar (Desktop) -->
        <div id="sidebar" class="w-64 flex-shrink-0 bg-indigo-900 text-white transition-all duration-300 ease-in-out z-20 hidden md:flex flex-col">
            <div class="p-6">
                <h1 class="text-2xl font-bold whitespace-nowrap overflow-hidden">ChecklistKu</h1>
                <p id="sidebar-greeting" class="text-indigo-200 text-sm mt-1">Halo, User</p>
            </div>
            <nav class="flex-1 px-4 space-y-2 mt-4">
                <button onclick="window.setTab('today')" class="nav-btn-desktop w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-colors font-medium text-sm text-indigo-200 hover:bg-indigo-800/50 hover:text-white" data-tab="today"><i class="ph ph-check-circle text-xl"></i> Hari Ini</button>
                <button onclick="window.setTab('routines')" class="nav-btn-desktop w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-colors font-medium text-sm text-indigo-200 hover:bg-indigo-800/50 hover:text-white" data-tab="routines"><i class="ph ph-arrows-clockwise text-xl"></i> Rutinitas</button>
                <button onclick="window.setTab('history')" class="nav-btn-desktop w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-colors font-medium text-sm text-indigo-200 hover:bg-indigo-800/50 hover:text-white" data-tab="history"><i class="ph ph-list-dashes text-xl"></i> Riwayat</button>
                <div class="my-4 border-t border-indigo-800"></div>
                <button onclick="window.setTab('settings')" class="nav-btn-desktop w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-colors font-medium text-sm text-indigo-200 hover:bg-indigo-800/50 hover:text-white" data-tab="settings"><i class="ph ph-gear text-xl"></i> Pengaturan</button>
            </nav>
            <div class="p-4">
                <button onclick="window.logout()" class="w-full py-2 px-4 bg-indigo-800 hover:bg-red-600 text-white rounded-lg transition-colors text-sm font-medium">Keluar Akun</button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col h-full overflow-hidden relative w-full">
            
            <!-- Header -->
            <header class="bg-white border-b px-4 py-4 flex items-center justify-between z-10 shadow-sm shrink-0">
                <div class="flex items-center">
                    <button onclick="window.toggleSidebar()" class="hidden md:block p-2 -ml-2 mr-2 text-slate-400 hover:text-indigo-600 hover:bg-slate-100 rounded-lg transition-colors">
                        <i class="ph ph-list text-2xl"></i>
                    </button>
                    <h1 class="text-xl font-bold text-slate-800 md:hidden">ChecklistKu</h1>
                    <h2 id="header-title" class="text-xl font-bold text-slate-800 hidden md:block">Tugas Hari Ini</h2>
                </div>
                <div class="md:hidden flex items-center gap-2">
                    <span id="mobile-username" class="bg-indigo-100 text-indigo-800 px-3 py-1 rounded-full text-sm font-medium">User</span>
                    <button onclick="window.logout()" class="p-2 text-red-500 hover:bg-red-50 rounded-full"><i class="ph ph-sign-out text-xl"></i></button>
                </div>
            </header>

            <!-- Scrollable Content Area -->
            <main class="flex-1 overflow-y-auto p-4 md:p-6 pb-24 md:pb-6 relative w-full">
                <div id="main-container" class="mx-auto max-w-3xl transition-all duration-300">
                    <!-- Dynamic Content will be injected here -->
                </div>
            </main>

            <!-- Floating Add Button -->
            <div id="fab-container" class="absolute bottom-20 md:bottom-8 right-4 md:right-8 z-30">
                <button onclick="window.openAddModal()" class="bg-indigo-600 text-white p-4 rounded-full shadow-lg hover:bg-indigo-700 hover:scale-105 transition-all">
                    <i class="ph ph-plus text-2xl"></i>
                </button>
            </div>

            <!-- Bottom Navigation (Mobile) -->
            <nav class="md:hidden bg-white border-t flex justify-around p-2 shrink-0 z-20 pb-[max(env(safe-area-inset-bottom),0.5rem)]">
                <button onclick="window.setTab('today')" class="nav-btn-mobile flex flex-col items-center p-2 min-w-[70px] text-slate-400 hover:text-slate-600" data-tab="today">
                    <i class="ph ph-check-circle text-2xl mb-1"></i><span class="text-[10px] font-medium">Hari Ini</span>
                </button>
                <button onclick="window.setTab('routines')" class="nav-btn-mobile flex flex-col items-center p-2 min-w-[70px] text-slate-400 hover:text-slate-600" data-tab="routines">
                    <i class="ph ph-arrows-clockwise text-2xl mb-1"></i><span class="text-[10px] font-medium">Rutinitas</span>
                </button>
                <button onclick="window.setTab('history')" class="nav-btn-mobile flex flex-col items-center p-2 min-w-[70px] text-slate-400 hover:text-slate-600" data-tab="history">
                    <i class="ph ph-list-dashes text-2xl mb-1"></i><span class="text-[10px] font-medium">Riwayat</span>
                </button>
                <button onclick="window.setTab('settings')" class="nav-btn-mobile flex flex-col items-center p-2 min-w-[70px] text-slate-400 hover:text-slate-600" data-tab="settings">
                    <i class="ph ph-gear text-2xl mb-1"></i><span class="text-[10px] font-medium">Pengaturan</span>
                </button>
            </nav>
        </div>
    </div>

    <!-- ADD MODAL -->
    <div id="add-modal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm items-end md:items-center justify-center z-50 p-4">
        <div class="bg-white w-full max-w-md rounded-3xl md:rounded-2xl p-6 shadow-2xl slide-in max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-slate-800">Tambah Baru</h3>
                <button onclick="window.closeAddModal()" class="text-slate-400 hover:text-slate-600 bg-slate-100 p-2 rounded-full"><i class="ph ph-x"></i></button>
            </div>

            <div class="space-y-5">
                <div class="flex p-1 bg-slate-100 rounded-xl">
                    <button id="type-btn-task" onclick="window.setNewTaskType('task')" class="flex-1 py-2 text-sm font-medium rounded-lg transition-colors bg-white shadow text-indigo-700">Tugas Spesifik</button>
                    <button id="type-btn-routine" onclick="window.setNewTaskType('routine')" class="flex-1 py-2 text-sm font-medium rounded-lg transition-colors text-slate-500">Rutinitas</button>
                </div>

                <div>
                    <label id="label-title" class="block text-sm font-medium text-slate-600 mb-1">Nama Tugas</label>
                    <input type="text" id="new-task-title" placeholder="Contoh: Beli susu" class="w-full border-2 border-slate-200 rounded-xl p-3 focus:border-indigo-500 outline-none transition-colors"/>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-2">Prioritas</label>
                    <div class="grid grid-cols-2 gap-2" id="priority-container">
                        <!-- Rendered by JS -->
                    </div>
                </div>

                <div id="routine-days-container" class="hidden">
                    <label class="block text-sm font-medium text-slate-600 mb-2">Aktif pada hari:</label>
                    <div class="flex gap-1 justify-between mb-2" id="days-buttons-container">
                        <!-- Rendered by JS -->
                    </div>
                    <div class="flex gap-2">
                        <button onclick="window.setDays([0,1,2,3,4])" class="text-xs bg-slate-100 px-3 py-1.5 rounded-lg text-slate-600 hover:bg-slate-200">Senin-Jumat</button>
                        <button onclick="window.setDays([5,6])" class="text-xs bg-slate-100 px-3 py-1.5 rounded-lg text-slate-600 hover:bg-slate-200">Sabtu-Minggu</button>
                        <button onclick="window.setDays([0,1,2,3,4,5,6])" class="text-xs bg-slate-100 px-3 py-1.5 rounded-lg text-slate-600 hover:bg-slate-200">Tiap Hari</button>
                    </div>
                </div>

                <button onclick="window.saveNewTask()" class="w-full bg-indigo-600 text-white font-bold py-3.5 rounded-xl hover:bg-indigo-700 mt-2">Simpan</button>
            </div>
        </div>
    </div>

    <!-- FIREBASE & LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // CONFIG FIREBASE (Ganti dengan config milik Anda)
        const myFirebaseConfig = {
            apiKey: "AIzaSyCtK0rB1_fT89M-4bVPU-eo1ut9i6v9wvQ",
            authDomain: "taskward-e640f.firebaseapp.com",
            projectId: "taskward-e640f",
            storageBucket: "taskward-e640f.firebasestorage.app",
            messagingSenderId: "428504708156",
            appId: "1:428504708156:web:e0e15d83184050308a3f39"
        };

        const firebaseConfig = typeof __firebase_config !== 'undefined' && Object.keys(JSON.parse(__firebase_config)).length > 0 
            ? JSON.parse(__firebase_config) : myFirebaseConfig;
        
        let app, auth, db, firebaseUser = null;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'checklist-keluarga-app';

        if (Object.keys(firebaseConfig).length > 0 && firebaseConfig.apiKey !== "API_KEY_ANDA") {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);

            // Init Auth
            const initAuth = async () => {
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                } catch (error) { console.error("Auth error:", error); }
            };
            initAuth();
            onAuthStateChanged(auth, user => { firebaseUser = user; syncToFirebase(); });
        }

        // --- APP STATE ---
        const PRIORITIES = {
            RENDAH: { label: 'Rendah', color: 'bg-green-100 text-green-800 border-green-200', ring: 'ring-green-400' },
            BIASA: { label: 'Biasa', color: 'bg-blue-100 text-blue-800 border-blue-200', ring: 'ring-blue-400' },
            TINGGI: { label: 'Tinggi', color: 'bg-orange-100 text-orange-800 border-orange-200', ring: 'ring-orange-400' },
            BUTUH: { label: 'Sangat Butuh', color: 'bg-red-100 text-red-800 border-red-200', ring: 'ring-red-400' }
        };
        const DAY_NAMES = ['Sn', 'Sl', 'Rb', 'Km', 'Jm', 'Sb', 'Mg'];
        
        let DEFAULT_USERS = {
            'user1': { id: 'user1', name: 'Abi', pin: '4444' },
            'user2': { id: 'user2', name: 'Umi', pin: '3333' },
            'user3': { id: 'user3', name: 'Kaivan', pin: '2222' },
            'user4': { id: 'user4', name: 'Zafira', pin: '1111' },
        };

        let state = {
            users: DEFAULT_USERS,
            tasks: {},
            history: {},
            currentUser: null,
            activeTab: 'today',
            isSidebarOpen: true,
            // Add Modal State
            newTaskType: 'task',
            newTaskPriority: 'BIASA',
            newTaskDays: [],
            // Login State
            selectedUserId: null
        };

        // --- INITIALIZATION ---
        function init() {
            // Load Local Storage
            const savedUsers = localStorage.getItem('checklist_users');
            if (savedUsers) state.users = JSON.parse(savedUsers);
            else localStorage.setItem('checklist_users', JSON.stringify(state.users));

            const savedTasks = localStorage.getItem('checklist_tasks');
            if (savedTasks) state.tasks = JSON.parse(savedTasks);

            const savedHistory = localStorage.getItem('checklist_history');
            if (savedHistory) state.history = JSON.parse(savedHistory);

            renderLoginUsers();

            // Setup Form listener
            document.getElementById('login-form').addEventListener('submit', (e) => {
                e.preventDefault();
                handleLoginSubmit();
            });
        }

        // --- RENDERERS ---
        function renderLoginUsers() {
            const container = document.getElementById('login-users-container');
            container.innerHTML = Object.values(state.users).map(user => `
                <button onclick="window.selectUser('${user.id}')" class="flex flex-col items-center justify-center p-6 border-2 border-slate-100 rounded-xl hover:border-indigo-300 hover:bg-indigo-50 transition-all group">
                    <div class="w-16 h-16 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600 mb-3 group-hover:scale-110 transition-transform">
                        <i class="ph ph-user text-3xl"></i>
                    </div>
                    <span class="font-semibold text-lg">${user.name}</span>
                </button>
            `).join('');
        }

        function updateUI() {
            // Update Active Navs
            document.querySelectorAll('.nav-btn-desktop').forEach(btn => {
                const isActive = btn.dataset.tab === state.activeTab;
                btn.className = `nav-btn-desktop w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-colors font-medium text-sm ${isActive ? 'bg-indigo-800 text-white' : 'text-indigo-200 hover:bg-indigo-800/50 hover:text-white'}`;
            });
            document.querySelectorAll('.nav-btn-mobile').forEach(btn => {
                const isActive = btn.dataset.tab === state.activeTab;
                btn.className = `nav-btn-mobile flex flex-col items-center p-2 min-w-[70px] ${isActive ? 'text-indigo-600 scale-110' : 'text-slate-400 hover:text-slate-600'} transition-all`;
            });

            // Update Headers
            const titles = { 'today': 'Tugas Hari Ini', 'routines': 'Semua Rutinitas', 'history': 'Riwayat Selesai', 'settings': 'Pengaturan Akun' };
            document.getElementById('header-title').innerText = titles[state.activeTab];
            
            // Hide/Show FAB
            document.getElementById('fab-container').style.display = (state.activeTab === 'today' || state.activeTab === 'routines') ? 'block' : 'none';

            // Render Content
            const container = document.getElementById('main-container');
            if (state.activeTab === 'history') {
                renderHistory(container);
            } else if (state.activeTab === 'settings') {
                renderSettings(container);
            } else {
                renderTasks(container);
            }
        }

        function getTodayIndex() {
            const day = new Date().getDay();
            return day === 0 ? 6 : day - 1; // 0=Senin, 6=Minggu
        }

        function renderTasks(container) {
            const userTasks = state.tasks[state.currentUser] || [];
            const todayIndex = getTodayIndex();
            
            let filteredTasks = userTasks.filter(task => {
                if (state.activeTab === 'today') {
                    if (task.type === 'task') return true;
                    if (task.type === 'routine') return task.days.includes(todayIndex);
                } else if (state.activeTab === 'routines') {
                    return task.type === 'routine';
                }
                return false;
            });

            let html = `<h3 class="font-semibold text-slate-500 uppercase text-sm tracking-wider mb-4 md:hidden">${state.activeTab === 'today' ? 'Hari Ini' : 'Semua Rutinitas'}</h3><div class="space-y-3">`;
            
            if (filteredTasks.length === 0) {
                html += `<div class="text-center py-10 text-slate-400"><p>Hore! Tidak ada tugas di sini.</p><p class="text-sm mt-1">Klik tombol tambah untuk membuat baru.</p></div>`;
            } else {
                filteredTasks.forEach(task => {
                    const priority = PRIORITIES[task.priority];
                    html += `
                        <div class="bg-white p-4 rounded-xl shadow-sm border flex items-center gap-4 transition-all ${task.isCompleted ? 'bg-slate-50 opacity-60' : ''}">
                            <button onclick="window.toggleTask('${task.id}', ${task.isCompleted})" class="shrink-0 ${task.isCompleted ? 'text-green-500' : 'text-slate-300 hover:text-indigo-400'}">
                                ${task.isCompleted ? '<i class="ph-fill ph-check-circle text-3xl"></i>' : '<i class="ph ph-circle text-3xl"></i>'}
                            </button>
                            <div class="flex-1 min-w-0">
                                <p class="font-medium truncate ${task.isCompleted ? 'line-through text-slate-500' : 'text-slate-800'}">${task.title}</p>
                                <div class="flex items-center gap-2 mt-1">
                                    <span class="text-[10px] px-2 py-0.5 rounded-full font-medium border ${priority.color}">${priority.label}</span>
                                    ${task.type === 'routine' ? `<span class="text-[10px] px-2 py-0.5 rounded-full font-medium bg-purple-100 text-purple-800 border border-purple-200 flex items-center gap-1"><i class="ph ph-arrows-clockwise"></i> Rutinitas</span>` : ''}
                                </div>
                            </div>
                        </div>
                    `;
                });
            }
            container.innerHTML = html + `</div>`;
        }

        function renderHistory(container) {
            const userHistory = state.history[state.currentUser] || [];
            let html = `<h3 class="font-semibold text-slate-500 uppercase text-sm tracking-wider mb-4 md:hidden">Riwayat Selesai</h3><div class="space-y-4">`;
            
            if (userHistory.length === 0) {
                html += `<div class="text-center py-10 text-slate-400">Belum ada tugas yang diselesaikan.</div>`;
            } else {
                userHistory.forEach(task => {
                    const priority = PRIORITIES[task.priority];
                    const time = new Date(task.completedAt).toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'});
                    html += `
                        <div class="bg-white p-4 rounded-xl border flex items-center gap-4 opacity-75">
                            <div class="text-green-500"><i class="ph-fill ph-check-circle text-3xl"></i></div>
                            <div class="flex-1">
                                <p class="font-medium line-through">${task.title}</p>
                                <p class="text-xs text-slate-400">Selesai pada: ${time}</p>
                            </div>
                            <span class="text-xs px-2 py-1 rounded-md font-medium border ${priority.color}">${priority.label}</span>
                        </div>
                    `;
                });
            }
            container.innerHTML = html + `</div>`;
        }

        function renderSettings(container) {
            const user = state.users[state.currentUser];
            container.innerHTML = `
                <div class="max-w-md mx-auto bg-white p-6 rounded-2xl shadow-sm border fade-in">
                    <h2 class="text-xl font-bold mb-6 flex items-center gap-2"><i class="ph ph-gear text-indigo-600"></i> Pengaturan Profil</h2>
                    <div id="settings-msg" class="mb-4 p-3 bg-green-50 text-green-700 rounded-lg text-sm border border-green-200 items-center gap-2 hidden"><i class="ph ph-check"></i> Perubahan disimpan!</div>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-600 mb-1">Nama Akun</label>
                            <input type="text" id="edit-name" value="${user.name}" class="w-full border rounded-xl p-3 focus:ring-2 focus:ring-indigo-200 outline-none" />
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-600 mb-1">Password</label>
                            <input type="text" id="edit-pin" value="${user.pin}" class="w-full border rounded-xl p-3 focus:ring-2 focus:ring-indigo-200 outline-none" placeholder="Masukkan Password" />
                            <p class="text-xs text-slate-500 mt-1">Bisa berupa huruf, angka, atau kombinasi.</p>
                        </div>
                        <button onclick="window.saveSettings()" class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-xl hover:bg-indigo-700 mt-2">Simpan Perubahan</button>
                    </div>
                </div>
            `;
        }

        function updateAddModalUI() {
            // Type toggle
            const isTask = state.newTaskType === 'task';
            document.getElementById('type-btn-task').className = `flex-1 py-2 text-sm font-medium rounded-lg transition-colors ${isTask ? 'bg-white shadow text-indigo-700' : 'text-slate-500'}`;
            document.getElementById('type-btn-routine').className = `flex-1 py-2 text-sm font-medium rounded-lg transition-colors ${!isTask ? 'bg-white shadow text-indigo-700' : 'text-slate-500'}`;
            document.getElementById('label-title').innerText = isTask ? 'Nama Tugas' : 'Nama Rutinitas';
            document.getElementById('routine-days-container').style.display = isTask ? 'none' : 'block';

            // Priorities
            const pCont = document.getElementById('priority-container');
            pCont.innerHTML = Object.entries(PRIORITIES).map(([key, val]) => `
                <button onclick="window.setPriority('${key}')" class="py-2 text-sm font-medium rounded-xl border-2 transition-all ${state.newTaskPriority === key ? val.color + ' ring-2 ring-offset-1 ' + val.ring : 'bg-slate-50 border-transparent text-slate-600 hover:bg-slate-100'}">${val.label}</button>
            `).join('');

            // Days
            const dCont = document.getElementById('days-buttons-container');
            dCont.innerHTML = DAY_NAMES.map((day, idx) => `
                <button onclick="window.toggleDay(${idx})" class="w-10 h-10 rounded-full text-sm font-medium flex items-center justify-center transition-colors ${state.newTaskDays.includes(idx) ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}">${day}</button>
            `).join('');
        }

        // --- ACTIONS / WINDOW METHODS ---
        window.selectUser = (userId) => {
            state.selectedUserId = userId;
            document.getElementById('login-users-container').classList.add('hidden');
            document.getElementById('login-password-container').classList.remove('hidden');
            document.getElementById('login-greeting').innerText = `Masuk sebagai ${state.users[userId].name}`;
            document.getElementById('pin-input').value = '';
            document.getElementById('pin-input').focus();
        };

        window.backToUsers = () => {
            document.getElementById('login-password-container').classList.add('hidden');
            document.getElementById('login-error').classList.add('hidden');
            document.getElementById('login-users-container').classList.remove('hidden');
        };

        const handleLoginSubmit = () => {
            const input = document.getElementById('pin-input').value;
            if (state.users[state.selectedUserId].pin === input) {
                state.currentUser = state.selectedUserId;
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('app-view').classList.remove('hidden');
                document.getElementById('sidebar-greeting').innerText = `Halo, ${state.users[state.currentUser].name}`;
                document.getElementById('mobile-username').innerText = state.users[state.currentUser].name;
                
                resetDailyTasks(state.currentUser);
                updateUI();
                syncToFirebase();
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        };

        window.logout = () => {
            state.currentUser = null;
            state.activeTab = 'today';
            window.backToUsers();
            document.getElementById('app-view').classList.add('hidden');
            document.getElementById('login-view').classList.remove('hidden');
        };

        window.setTab = (tab) => {
            state.activeTab = tab;
            updateUI();
        };

        window.toggleSidebar = () => {
            state.isSidebarOpen = !state.isSidebarOpen;
            const sidebar = document.getElementById('sidebar');
            const mainCont = document.getElementById('main-container');
            if (state.isSidebarOpen) {
                sidebar.classList.remove('hidden-sidebar');
                mainCont.classList.replace('max-w-4xl', 'max-w-3xl');
            } else {
                sidebar.classList.add('hidden-sidebar');
                mainCont.classList.replace('max-w-3xl', 'max-w-4xl');
            }
        };

        // --- DATA LOGIC ---
        const syncToFirebase = async () => {
            if (!firebaseUser || !db || !state.currentUser) return;
            try {
                const docRef = doc(db, 'artifacts', appId, 'users', firebaseUser.uid, 'data', state.currentUser);
                await setDoc(docRef, {
                    tasks: state.tasks[state.currentUser] || [],
                    history: state.history[state.currentUser] || [],
                    profile: state.users[state.currentUser]
                }, { merge: true });
            } catch (error) { console.error("Firebase sync error:", error); }
        };

        function saveData() {
            localStorage.setItem('checklist_users', JSON.stringify(state.users));
            localStorage.setItem('checklist_tasks', JSON.stringify(state.tasks));
            localStorage.setItem('checklist_history', JSON.stringify(state.history));
            syncToFirebase();
        }

        const resetDailyTasks = (userId) => {
            const userTasks = state.tasks[userId] || [];
            const todayStr = new Date().toDateString();
            let isUpdated = false;
            
            state.tasks[userId] = userTasks.map(task => {
                if (task.type === 'routine' && task.lastReset !== todayStr) {
                    isUpdated = true;
                    return { ...task, isCompleted: false, lastReset: todayStr };
                }
                return task;
            });

            if (isUpdated) saveData();
        };

        window.saveSettings = () => {
            const newName = document.getElementById('edit-name').value;
            const newPin = document.getElementById('edit-pin').value;
            if (!newName.trim()) return;

            state.users[state.currentUser].name = newName;
            state.users[state.currentUser].pin = newPin || '00000000';
            saveData();

            document.getElementById('sidebar-greeting').innerText = `Halo, ${newName}`;
            document.getElementById('mobile-username').innerText = newName;
            renderLoginUsers(); // Update background state
            
            const msg = document.getElementById('settings-msg');
            msg.style.display = 'flex';
            setTimeout(() => msg.style.display = 'none', 3000);
        };

        window.toggleTask = (taskId, isCompleted) => {
            let userTasks = state.tasks[state.currentUser] || [];
            let userHistory = state.history[state.currentUser] || [];
            const taskIndex = userTasks.findIndex(t => t.id === taskId);
            
            if (taskIndex === -1) return;
            const task = userTasks[taskIndex];

            if (!isCompleted) { // Mark Complete
                userTasks[taskIndex].isCompleted = true;
                userHistory.unshift({ ...task, historyId: Date.now().toString(), completedAt: new Date().toISOString() });
                if (task.type === 'task') userTasks = userTasks.filter(t => t.id !== taskId);
            } else { // Unmark
                userTasks[taskIndex].isCompleted = false;
                const historyIndex = userHistory.findIndex(h => h.id === taskId);
                if (historyIndex !== -1) userHistory.splice(historyIndex, 1);
            }

            state.tasks[state.currentUser] = userTasks;
            state.history[state.currentUser] = userHistory;
            saveData();
            updateUI();
        };

        // --- ADD MODAL LOGIC ---
        window.openAddModal = () => {
            state.newTaskType = 'task';
            state.newTaskPriority = 'BIASA';
            state.newTaskDays = [];
            document.getElementById('new-task-title').value = '';
            updateAddModalUI();
            const modal = document.getElementById('add-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        };

        window.closeAddModal = () => {
            const modal = document.getElementById('add-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        };

        window.setNewTaskType = (type) => { state.newTaskType = type; updateAddModalUI(); };
        window.setPriority = (pri) => { state.newTaskPriority = pri; updateAddModalUI(); };
        window.toggleDay = (dayIdx) => {
            if (state.newTaskDays.includes(dayIdx)) state.newTaskDays = state.newTaskDays.filter(d => d !== dayIdx);
            else state.newTaskDays.push(dayIdx);
            updateAddModalUI();
        };
        window.setDays = (daysArr) => { state.newTaskDays = daysArr; updateAddModalUI(); };

        window.saveNewTask = () => {
            const title = document.getElementById('new-task-title').value;
            if (!title.trim()) return;

            const newTask = {
                id: Date.now().toString(),
                title: title,
                type: state.newTaskType,
                priority: state.newTaskPriority,
                isCompleted: false,
                createdAt: new Date().toISOString()
            };

            if (state.newTaskType === 'routine') {
                newTask.days = state.newTaskDays.length > 0 ? state.newTaskDays : [0,1,2,3,4,5,6];
                newTask.lastReset = new Date().toDateString();
            }

            if (!state.tasks[state.currentUser]) state.tasks[state.currentUser] = [];
            state.tasks[state.currentUser].push(newTask);
            
            saveData();
            window.closeAddModal();
            updateUI();
        };

        // Start App
        init();

    </script>
</body>
</html>
